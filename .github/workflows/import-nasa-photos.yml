name: Import reviewed photo batches
on:
  push:
    branches: [main]
    paths:
      - 'curation/batches/*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photo-import-main
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install JPEG validation and resizing library
        run: python -m pip install "Pillow>=11,<13"
      - name: Fetch and register licensed source images
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from import_photo_batch import import_batch
          for batch in sorted(Path("curation/batches").glob("*.json")):
              print(f"Checking {batch}", flush=True)
              import_batch(batch)
          PY
      - name: Validate complete archive and website
        run: |
          python -m unittest discover -s tests -v
          python tools/archive.py build build/centauri.zip
          python tools/archive.py verify build/centauri.zip
          python tools/build_site.py
      - name: Commit acquired JPEGs and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/photos/ archive/catalog.json curation/images-100.json
          if ! git diff --staged --quiet; then
            git commit -m 'Import reviewed photo batches with source metadata'
            git push origin HEAD:main
          fi
