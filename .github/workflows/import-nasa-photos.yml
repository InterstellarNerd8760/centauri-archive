name: Import reviewed NASA image batch
on:
  push:
    branches: [main]
    paths:
      - 'curation/batches/nasa-01.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photo-import-main
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch and register NASA source images
        run: python tools/import_photo_batch.py curation/batches/nasa-01.json
      - name: Validate complete archive and website
        run: |
          python -m unittest discover -s tests -v
          python tools/archive.py build build/centauri.zip
          python tools/archive.py verify build/centauri.zip
          python tools/build_site.py
      - name: Commit acquired JPEGs and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/photos/ archive/catalog.json curation/images-100.json
          if ! git diff --staged --quiet; then
            git commit -m 'Import NASA photo batch 01 with source metadata'
            git push origin HEAD:main
          fi
