name: Validate archive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-raster.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/raw_raster_independent.cjs
      - run: node tests/capacity.cjs
      - run: for file in website/*.js; do node --check "$file" || exit; done
      - run: python tools/archive.py build build/centauri.zip
      - run: python tools/archive.py inspect build/centauri.zip
      - run: python tools/archive.py verify build/centauri.zip
      - run: python tools/build_site.py
      - run: cmp build/centauri.zip build/site/downloads/centauri.zip
