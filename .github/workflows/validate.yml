name: Validate archive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: node --check website/library.js && node --check website/decoder.js && node --check website/carrier.js && node --check website/images.js
      - run: python tools/archive.py build build/centauri.zip
      - run: python tools/archive.py inspect build/centauri.zip
      - run: python tools/archive.py verify build/centauri.zip
      - run: python tools/build_site.py
      - run: cmp build/centauri.zip build/site/downloads/centauri.zip
