<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Stellar evolution</title><desc id="desc">Two illustrative pathways through stellar evolution, depending on initial mass.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7ba5be"/></marker></defs><rect width="760" height="330" fill="#0a1521"/><g font-family="system-ui, sans-serif"><text x="24" y="31" text-anchor="start" font-size="21" fill="#e4edf5">Stellar evolution</text><text x="24" y="53" text-anchor="start" font-size="13" fill="#afc5d5">Two illustrative pathways through stellar evolution, depending on initial mass.</text><circle cx="78" cy="175" r="33" fill="#344e6a" stroke="none" stroke-width="1.5"/><circle cx="62" cy="161" r="17" fill="#547089" stroke="none" stroke-width="1.5"/><circle cx="88" cy="182" r="23" fill="#547089" stroke="none" stroke-width="1.5"/><text x="78" y="235" text-anchor="middle" font-size="15" fill="#e4edf5">Gas cloud</text><path d="M120 175L192 175" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><circle cx="226" cy="175" r="24" fill="#f0c77b" stroke="none" stroke-width="1.5"/><circle cx="223" cy="172" r="7.199999999999999" fill="#fff1c3" stroke="none" stroke-width="1.5"/><text x="226" y="221" text-anchor="middle" font-size="15" fill="#e4edf5">Fusion</text><path d="M255 175H286V112H347M286 175V238H347" fill="none" stroke="#7ba5be" stroke-width="2"/><text x="295" y="93" text-anchor="middle" font-size="14" fill="#e4edf5">Sun-like</text><text x="295" y="259" text-anchor="middle" font-size="14" fill="#e4edf5">Massive</text><circle cx="390" cy="112" r="33" fill="#dc7d58" stroke="none" stroke-width="1.5"/><circle cx="387" cy="109" r="9.9" fill="#fff1c3" stroke="none" stroke-width="1.5"/><text x="390" y="161" text-anchor="middle" font-size="14" fill="#e4edf5">Red giant</text><path d="M425 112L542 112" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><circle cx="577" cy="112" r="10" fill="#e3eef9" stroke="none" stroke-width="1.5"/><circle cx="574" cy="109" r="3" fill="#fff1c3" stroke="none" stroke-width="1.5"/><text x="577" y="147" text-anchor="middle" font-size="14" fill="#e4edf5">White dwarf</text><circle cx="390" cy="238" r="37" fill="#c36252" stroke="none" stroke-width="1.5"/><circle cx="387" cy="235" r="11.1" fill="#fff1c3" stroke="none" stroke-width="1.5"/><text x="390" y="293" text-anchor="middle" font-size="14" fill="#e4edf5">Core collapse</text><path d="M430 238L513 238" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><circle cx="550" cy="238" r="12" fill="#b1d7ef" stroke="none" stroke-width="1.5"/><circle cx="666" cy="238" r="12" fill="#02060c" stroke="#9bb4c7" stroke-width="1.5"/><text x="608" y="212" text-anchor="middle" font-size="13" fill="#e4edf5">Possible remnants</text><text x="550" y="272" text-anchor="middle" font-size="12" fill="#e4edf5">Neutron star</text><text x="666" y="272" text-anchor="middle" font-size="12" fill="#e4edf5">Black hole</text><text x="736" y="314" text-anchor="end" font-size="10" fill="#9bb4c7">CENTAURI ARCHIVE / ORIGINAL SCHEMATIC</text></g></svg>
