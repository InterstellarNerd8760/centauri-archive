<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Orders of magnitude</title><desc id="desc">A base-ten logarithmic number line with equal spacing for each factor of ten.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7ba5be"/></marker></defs><rect width="760" height="330" fill="#0a1521"/><g font-family="system-ui, sans-serif"><text x="24" y="31" text-anchor="start" font-size="21" fill="#e4edf5">Orders of magnitude</text><text x="24" y="53" text-anchor="start" font-size="13" fill="#afc5d5">A base-ten logarithmic number line with equal spacing for each factor of ten.</text><path d="M70 150L688 150" fill="none" stroke="#70c9ed" stroke-width="2" /><path d="M70 150L70 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="70" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10⁻³</text><text x="70" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">0.001</text><text x="121" y="133" text-anchor="middle" font-size="13" fill="#70c9ed">×10</text><path d="M173 150L173 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="173" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10⁻²</text><text x="173" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">0.01</text><text x="224" y="133" text-anchor="middle" font-size="13" fill="#70c9ed">×10</text><path d="M276 150L276 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="276" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10⁻¹</text><text x="276" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">0.1</text><text x="327" y="133" text-anchor="middle" font-size="13" fill="#70c9ed">×10</text><path d="M379 150L379 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="379" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10⁰</text><text x="379" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">1</text><text x="430" y="133" text-anchor="middle" font-size="13" fill="#70c9ed">×10</text><path d="M482 150L482 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="482" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10¹</text><text x="482" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">10</text><text x="533" y="133" text-anchor="middle" font-size="13" fill="#70c9ed">×10</text><path d="M585 150L585 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="585" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10²</text><text x="585" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">100</text><text x="636" y="133" text-anchor="middle" font-size="13" fill="#70c9ed">×10</text><path d="M688 150L688 163" fill="none" stroke="#7ba5be" stroke-width="2" /><text x="688" y="188" text-anchor="middle" font-size="18" fill="#e4edf5">10³</text><text x="688" y="208" text-anchor="middle" font-size="13" fill="#afc5d5">1000</text><text x="380" y="264" text-anchor="middle" font-size="17" fill="#e4edf5">Six orders of magnitude separate 0.001 and 1000.</text><text x="736" y="314" text-anchor="end" font-size="10" fill="#9bb4c7">CENTAURI ARCHIVE / ORIGINAL SCHEMATIC</text></g></svg>
