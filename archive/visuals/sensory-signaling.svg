<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">From stimulus to perception</title><desc id="desc">An illustrative path from a stimulus through sensory receptors and nervous-system processing.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7ba5be"/></marker></defs><rect width="760" height="330" fill="#0a1521"/><g font-family="system-ui, sans-serif"><text x="24" y="31" text-anchor="start" font-size="21" fill="#e4edf5">From stimulus to perception</text><text x="24" y="53" text-anchor="start" font-size="13" fill="#afc5d5">An illustrative path from a stimulus through sensory receptors and nervous-system processing.</text><path d="M20 159q13 -38 26 0t26 0t26 0" fill="none" stroke="#70c9ed" stroke-width="3"/><text x="65" y="224" text-anchor="middle" font-size="17" fill="#e4edf5">Stimulus</text><text x="65" y="244" text-anchor="middle" font-size="13" fill="#afc5d5">Light, force, etc.</text><path d="M110 160L153 160" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><circle cx="190" cy="160" r="30" fill="#355a63" stroke="#70c9ed" stroke-width="1.5"/><path d="M169 152L180 166L200 145L212 165" fill="none" stroke="#e8b765" stroke-width="3"/><text x="190" y="224" text-anchor="middle" font-size="17" fill="#e4edf5">Receptor</text><text x="190" y="244" text-anchor="middle" font-size="13" fill="#afc5d5">Transduction</text><path d="M222 160L292 160" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><circle cx="329" cy="160" r="15" fill="#70c9ed" stroke="none" stroke-width="1.5"/><path d="M313 152L288 128M314 167L289 188M329 145V124M344 160H445" fill="none" stroke="#70c9ed" stroke-width="3"/><rect x="352" y="152" width="16" height="16" rx="5" fill="#355a63" stroke="#70c9ed"/><rect x="375" y="152" width="16" height="16" rx="5" fill="#355a63" stroke="#70c9ed"/><rect x="398" y="152" width="