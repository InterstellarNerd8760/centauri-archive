<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Three types of plate boundary</title><desc id="desc">Schematic divergence, subduction at a convergent boundary, and transform motion.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7ba5be"/></marker></defs><rect width="760" height="330" fill="#0a1521"/><g font-family="system-ui, sans-serif"><text x="24" y="31" text-anchor="start" font-size="21" fill="#e4edf5">Three types of plate boundary</text><text x="24" y="53" text-anchor="start" font-size="13" fill="#afc5d5">Schematic divergence, subduction at a convergent boundary, and transform motion.</text><text x="133" y="92" text-anchor="middle" font-size="17" fill="#e4edf5">Divergent</text><path d="M18 178H110L132 198L154 178H248V222H18Z" fill="#38566a" stroke="#7ba5be" stroke-width="2"/><path d="M106 154L53 154" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><path d="M158 154L214 154" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><path d="M132 270L132 200" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="133" y="291" text-anchor="middle" font-size="13" fill="#e4edf5">New crust at ridge</text><text x="380" y="92" text-anchor="middle" font-size="17" fill="#e4edf5">Convergent</text><path d="M265 178H356L465 263L452 276L346 220H265Z" fill="#38566a" stroke="#7ba5be" stroke-width="2"/><path d="M376 174H495V215H413Z" fill="#496456" stroke="#7ba5be" stroke-width="2"/><path d="M293 153L355 153" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><path d="M469 153L408 153" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="291" text-anchor="middle" font-size="13" fill="#e4edf5">One plate descends</text><text x="627" y="92" text-anchor="middle" font-size="17" fill="#e4edf5">Transform (top view)</text><rect x="512" y="132" width="109" height="135" rx="5" fill="#38566a" stroke="#55778d"/><rect x="624" y="132" width="118" height="135" rx="5" fill="#496456" stroke="#55778d"/><path d="M567 235L567 151" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><path d="M684 151L684 235" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="627" y="291" text-anchor="middle" font-size="13" fill="#e4edf5">Plates slide past</text><text x="736" y="314" text-anchor="end" font-size="10" fill="#9bb4c7">CENTAURI ARCHIVE / ORIGINAL SCHEMATIC</text></g></svg>
