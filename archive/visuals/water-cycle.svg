<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">The water cycle</title><desc id="desc">Water moves among surface, atmosphere and groundwater reservoirs.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7ba5be"/></marker></defs><rect width="760" height="330" fill="#0a1521"/><g font-family="system-ui, sans-serif"><text x="24" y="31" text-anchor="start" font-size="21" fill="#e4edf5">The water cycle</text><text x="24" y="53" text-anchor="start" font-size="13" fill="#afc5d5">Water moves among surface, atmosphere and groundwater reservoirs.</text><path d="M18 240H268L370 100L445 190L510 130L740 240V293H18Z" fill="#233b3e" stroke="#648d82" stroke-width="1.5"/><path d="M18 240H290V293H18Z" fill="#215876" stroke="#70c9ed" stroke-width="1.5"/><path d="M291 241Q350 220 405 242T580 256" fill="#2c748e" stroke="#70c9ed" stroke-width="2"/><circle cx="260" cy="111" r="22" fill="#8596aa" stroke="none" stroke-width="1.5"/><circle cx="293" cy="102" r="29" fill="#a0b4c4" stroke="none" stroke-width="1.5"/><circle cx="325" cy="115" r="22" fill="#8596aa" stroke="none" stroke-width="1.5"/><path d="M146 220L246 132" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="122" y="156" text-anchor="middle" font-size="14" fill="#e4edf5">Evaporation</text><text x="294" y="75" text-anchor="middle" font-size="14" fill="#e4edf5">Condensation</text><path d="M320 140L369 189" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><path d="M341 141L395 192" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="438" y="168" text-anchor="middle" font-size="14" fill="#e4edf5">Precipitation</text><path d="M523 226L330 240" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="530" y="218" text-anchor="middle" font-size="14" fill="#e4edf5">Runoff</text><path d="M610 238L610 276" fill="none" stroke="#7ba5be" stroke-width="2" marker-end="url(#arrow)"/><text x="648" y="283" text-anchor="middle" font-size="13" fill="#e4edf5">Infiltration</text><text x="95" y="272" text-anchor="middle" font-size="15" fill="#e4edf5">Ocean</text><text x="736" y="314" text-anchor="end" font-size="10" fill="#9bb4c7">CENTAURI ARCHIVE / ORIGINAL SCHEMATIC</text></g></svg>
